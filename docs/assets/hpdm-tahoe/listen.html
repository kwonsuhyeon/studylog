<style>

.en-toggle{position:fixed;right:28px;bottom:86px;border:none;border-radius:999px;background:var(--blue);color:#fff;font-family:inherit;font-weight:700;font-size:14px;padding:10px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}

  .listen{grid-template-columns:1fr;padding:0 16px 60px}

}

<body>
<div class="listen-head"><header class="hero"><h1>Tahoe: Tree Structure-Aware High Performance Inference Engine for Decision Tree Ensemble on GPU 듣기</h1><p>음성 8개 연속 재생 · 마지막 재생 위치 기억 · 잠금 화면에서 이전·다음 트랙 이동</p><div class="links"><a href="Xie_2021_Tahoe_배경지식_노트.html">배경지식 노트</a><a href="Xie_2021_Tahoe_논문_해설.html">논문 해설</a><a href="Xie_2021_Tahoe_그림표_해설.html">그림·표 해설</a><a href="Xie_2021_Tahoe_번역.html">번역 읽기</a></div></header></div>

<h2>트랙 목록</h2>
<div class="doc-group">배경지식 노트</div><ul class="tracks"><li><button type="button"><span class="tag">A</span><span><div class="t">결정트리 추론과 배열 저장</div><div class="m">1~3절</div></span><span class="len">5.4분 gemini</span></button></li><li><button type="button"><span class="tag">B</span><span><div class="t">병합 접근·부하 불균형·리덕션</div><div class="m">4~6절</div></span><span class="len">5.3분 gemini</span></button></li><li><button type="button"><span class="tag">C</span><span><div class="t">추론 전략과 SimHash·LSH</div><div class="m">7~9절</div></span><span class="len">5.2분 gemini</span></button></li><li><button type="button"><span class="tag">D</span><span><div class="t">성능 모델 읽기</div><div class="m">10~11절</div></span><span class="len">5.5분 gemini</span></button></li></ul><div class="doc-group">논문 해설</div><ul class="tracks"><li><button type="button"><span class="tag">E</span><span><div class="t">문제와 동기 실험</div><div class="m">1~3절</div></span><span class="len">5.3분 gemini</span></button></li><li><button type="button"><span class="tag">F</span><span><div class="t">노드·트리 재배치와 적응형 형식</div><div class="m">4~6절</div></span><span class="len">5.4분 gemini</span></button></li><li><button type="button"><span class="tag">G</span><span><div class="t">네 가지 전략과 성능 모델</div><div class="m">7~9절</div></span><span class="len">5.5분 gemini</span></button></li><li><button type="button"><span class="tag">H</span><span><div class="t">실험 결과와 토론</div><div class="m">10~15절</div></span><span class="len">5.4분 gemini</span></button></li></ul>

<script>
var T=[{"tag": "A", "title": "결정트리 추론과 배열 저장", "doc": "배경지식 노트", "sections": "1~3절", "len": "5.4분 gemini", "src": "audio/Xie_2021_Tahoe_A.mp3"}, {"tag": "B", "title": "병합 접근·부하 불균형·리덕션", "doc": "배경지식 노트", "sections": "4~6절", "len": "5.3분 gemini", "src": "audio/Xie_2021_Tahoe_B.mp3"}, {"tag": "C", "title": "추론 전략과 SimHash·LSH", "doc": "배경지식 노트", "sections": "7~9절", "len": "5.2분 gemini", "src": "audio/Xie_2021_Tahoe_C.mp3"}, {"tag": "D", "title": "성능 모델 읽기", "doc": "배경지식 노트", "sections": "10~11절", "len": "5.5분 gemini", "src": "audio/Xie_2021_Tahoe_D.mp3"}, {"tag": "E", "title": "문제와 동기 실험", "doc": "논문 해설", "sections": "1~3절", "len": "5.3분 gemini", "src": "audio/Xie_2021_Tahoe_E.mp3"}, {"tag": "F", "title": "노드·트리 재배치와 적응형 형식", "doc": "논문 해설", "sections": "4~6절", "len": "5.4분 gemini", "src": "audio/Xie_2021_Tahoe_F.mp3"}, {"tag": "G", "title": "네 가지 전략과 성능 모델", "doc": "논문 해설", "sections": "7~9절", "len": "5.5분 gemini", "src": "audio/Xie_2021_Tahoe_G.mp3"}, {"tag": "H", "title": "실험 결과와 토론", "doc": "논문 해설", "sections": "10~15절", "len": "5.4분 gemini", "src": "audio/Xie_2021_Tahoe_H.mp3"}], KEY="Xie_2021_Tahoe-listen", a=document.getElementById('player'), cur=0, lastSave=0;
var rows=[].slice.call(document.querySelectorAll('.tracks button'));
function store(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
function mark(){
  var s=saved(), done=s.done||{};
  rows.forEach(function(b,i){b.classList.toggle('on',i===cur);b.classList.toggle('done',!!done[T[i].tag]);});
  document.getElementById('now').textContent=T[cur].tag+'. '+T[cur].title;
  document.getElementById('sub').textContent=[T[cur].doc,T[cur].sections].filter(Boolean).join(' · ')+'  ('+(cur+1)+'/'+T.length+')';
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:T[cur].tag+'. '+T[cur].title,artist:"Tahoe: Tree Structure-Aware High Performance Inference Engine for Decision Tree Ensemble on GPU",album:'paper-study'});
  }
}
function load(i,play,at){
  cur=Math.max(0,Math.min(T.length-1,i));
  a.src=T[cur].src; a.playbackRate=parseFloat(document.getElementById('rate').value);
  if(at){a.addEventListener('loadedmetadata',function f(){a.removeEventListener('loadedmetadata',f);try{a.currentTime=at;}catch(e){}});}
  mark(); if(play){var p=a.play(); if(p&&p.catch){p.catch(function(){});}}
}
function remember(extra){var s=saved(); s.i=cur; s.t=a.currentTime||0; s.rate=document.getElementById('rate').value; if(extra){s.done=s.done||{}; s.done[extra]=1;} store(s);}
a.addEventListener('timeupdate',function(){var n=Date.now(); if(n-lastSave>5000){lastSave=n; remember();}});
a.addEventListener('pause',function(){remember();});
a.addEventListener('ended',function(){remember(T[cur].tag); if(cur+1<T.length){load(cur+1,true,0);} else {mark();}});
a.addEventListener('ratechange',function(){});
rows.forEach(function(b,i){b.addEventListener('click',function(){load(i,true,0);});});
document.getElementById('prev').addEventListener('click',function(){load(cur-1,true,0);});
document.getElementById('next').addEventListener('click',function(){load(cur+1,true,0);});
document.getElementById('back').addEventListener('click',function(){a.currentTime=Math.max(0,a.currentTime-15);});
document.getElementById('fwd').addEventListener('click',function(){a.currentTime=a.currentTime+15;});
document.getElementById('toggle').addEventListener('click',function(){if(a.paused){a.play();}else{a.pause();}});
a.addEventListener('play',function(){document.getElementById('toggle').textContent='일시정지';});
a.addEventListener('pause',function(){document.getElementById('toggle').textContent='재생';});
document.getElementById('rate').addEventListener('change',function(){a.playbackRate=parseFloat(this.value); remember();});
